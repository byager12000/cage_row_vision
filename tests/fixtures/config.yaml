# TEST FIXTURE - fixed layout for the synthetic tests. Not the bench config (that is ../../config.yaml).
#

units: in                 # all lengths below are in these units (in | mm)
layout_confirmed: false

camera:
  index: 2                # Stopmotion Explosion webcam on Ben's laptop (found 2026-09-28). `uv run python -m cage_vision list-cameras`
  backend: dshow          # dshow | msmf | any
  fourcc: MJPG            # needed for 1080p at full frame rate on USB 2.0 webcams
  width: 1920
  height: 1080
  lock_settings: true     # disable auto exposure / focus / white balance where supported
  exposure: null          # set once lighting is final (camera-specific units; DirectShow is log2 seconds, e.g. -6)
  focus: null
  white_balance: null
  warmup_frames: 10

markers:
  dictionary: DICT_4X4_50
  # World coordinates of each marker CENTER. MEASURE.
  # Convention used here: marker 0 is the origin, +X runs toward marker 1,
  # +Y runs toward marker 3. Any convention works as long as the numbers are real.
  # Placeholders sized for a ~40 x 30 in camera field (markers ~2.5 in in from each edge).
  positions:
    0: [0.0, 0.0]
    1: [35.0, 0.0]
    2: [35.0, 25.0]
    3: [0.0, 25.0]
  size: 3.0               # printed black square side. MEASURE the print (printers scale).
  size_tolerance: 0.05    # fraction
  baseline_file: null      # synthetic renders: each scene has its own camera; baseline tests pass one explicitly
  require_baseline: false
  max_relative_move_px: 1.0
  camera_shift_warn_px: 20.0

paper:
  length: 11.0            # MEASURE (long side)
  width: 8.5              # MEASURE (short side)
  size_tolerance: 0.25    # reject objects whose measured L/W differ from nominal by more than this
  polarity: bright        # paper lighter than table
  threshold: otsu
  fixed_threshold: 128
  min_rectangularity: 0.92
  border_margin_px: 4
  marker_mask_pad: 0.35

output:
  directory: runs
  frames_per_placement: 10
