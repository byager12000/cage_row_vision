# STK-14 Cage Row Vision — Phase 1 bench configuration
#
# Home bench, measured by Ben 2026-09-28 with a tape measure:
#   marker rectangle 30 x 20 in center-to-center, diagonals ~36 in (30x20 predicts 36.06),
#   printed squares 3 x 3 in, test sheet = US letter 11 x 8.5 in.

units: in                 # all lengths below are in these units (in | mm)
layout_confirmed: true

camera:
  index: 1                # Stopmotion Explosion webcam. Windows renumbers after replug (was 2 on 09-28); the app searches if this one cannot see the markers
  backend: dshow          # dshow | msmf | any
  fourcc: MJPG            # needed for 1080p at full frame rate on USB 2.0 webcams
  width: 1920
  height: 1080
  lock_settings: true     # disable auto exposure / focus / white balance where supported
  exposure: -5            # DirectShow log2 s. Chosen by sweep 2026-09-28 (home bench): brightest with 0% clipped; -4 jumps to 42% clipped
  focus: null
  white_balance: null
  warmup_frames: 10
  height_above_table: 34.25   # lens above the table, Ben's tape 2026-09-28

markers:
  dictionary: DICT_4X4_50
  # World coordinates of each marker CENTER (measured).
  # Convention used here: marker 0 is the origin, +X runs toward marker 1,
  # +Y runs toward marker 3. Any convention works as long as the numbers are real.
  # 0 = bottom left, 1 = bottom right, 2 = top right, 3 = top left (as seen standing at the table).
  positions:
    0: [0.0, 0.0]
    1: [30.0, 0.0]
    2: [30.0, 20.0]
    3: [0.0, 20.0]
  size: 3.0               # printed black square side (measured 3 in)
  size_tolerance: 0.05    # fraction; gross-error check only (markers read ~1% small from blur)
  # Setup baseline (set-baseline): a marker moving relative to the others invalidates frames.
  baseline_file: baseline.json
  require_baseline: true
  max_relative_move_px: 1.0     # bench noise <= 0.34 px; a 0.1 in bump of one marker gives ~1 px
  camera_shift_warn_px: 20.0

paper:
  length: 11.0            # US letter, long side
  width: 8.5              # US letter, short side
  size_tolerance: 0.25    # reject objects whose measured L/W differ from nominal by more than this
  polarity: bright        # paper lighter than table
  threshold: otsu
  fixed_threshold: 128
  min_rectangularity: 0.92
  border_margin_px: 4
  marker_mask_pad: 0.35

cage:
  orientation: upright       # upright only for now (rim on top)
  height: 5.0                # Ben's tape
  rim_length: 11.6           # measured by vision 2026-09-28 (11.61 / 11.58 in two shots)
  rim_width: 7.4             # measured by vision 2026-09-28 (7.38)
  bottom_length: 11.25       # Ben's tape 2026-09-29
  bottom_width: 7.0          # Ben's tape 2026-09-29
  size_tolerance: 0.4
  lift_threshold: 12
  position_tolerance: 0.5    # Ben: cage must be within +/-1/2 in of the target position
  target_file: cage_target.json

output:
  directory: runs
  frames_per_placement: 10
